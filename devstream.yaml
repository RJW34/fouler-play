{
  "schemaVersion": "devstream-project/v1",
  "projectId": "fouler-play",
  "displayName": "fouler-play",
  "root": "/home/ryan/projects/fouler-play",
  "role": "proof-gated-showdown-runtime",
  "machine": "UNASSIGNED_PROOF_WINDOW_ONLY",
  "mission": "Train and evaluate a high-level Gen 9 OU bot through proof-gated bounded battle cycles, replay/decision proof, DEKU-guided analysis, and iteration toward 1700 ELO play.",
  "runtimeAuthority": {
    "defaultRuntime": "none",
    "optionalRuntimeProfile": "JIGGLYPUFF",
    "runtimeLeasePath": "devstream/truth/runtime-lease.json",
    "requiresProofWindow": true,
    "requiresRuntimeLease": true,
    "requiresFiniteRunCount": true,
    "requiresFiniteMaxCycles": true,
    "allowExecuteWithoutProofWindow": false,
    "allowScheduledTaskAutostart": false,
    "normalAutostart": false,
    "notes": "JIGGLYPUFF is an optional Windows runtime profile only. Status and dry-run commands are allowed; --execute, scheduled tasks, laddering, Discord posting, and replay uploads require a current proof window plus a runtime lease."
  },
  "runner": {
    "safeToAutostart": false,
    "start": [".venv/bin/python", "scripts/jigglypuff_devstream_control.py", "start", "--run-count", "10", "--max-concurrent-battles", "3", "--max-cycles", "1"],
    "stop": [".venv/bin/python", "scripts/jigglypuff_devstream_control.py", "stop"],
    "status": [".venv/bin/python", "scripts/jigglypuff_devstream_control.py", "status"]
  },
  "health": {
    "command": [".venv/bin/python", "scripts/jigglypuff_devstream_control.py", "status"],
    "timeoutSeconds": 45
  },
  "truth": {
    "files": [
      {"label": "health probe", "path": "scripts/devstream_health.py", "required": true},
      {"label": "human mission", "path": "docs/PROJECT_MISSION.md", "required": true},
      {"label": "stream status", "path": "stream_status.json", "required": false},
      {"label": "daily stats", "path": "daily_stats.json", "required": false},
      {"label": "active battles", "path": "active_battles.json", "required": false},
      {"label": "battle stats", "path": "battle_stats.json", "required": false},
      {"label": "autoresearch json", "path": "replay_analysis/autoresearch_latest.json", "required": false},
      {"label": "autoresearch report", "path": "replay_analysis/reports/autoresearch_latest.md", "required": false},
      {"label": "bounded session planner", "path": "scripts/devstream_session.py", "required": true},
      {"label": "showdown login check", "path": "scripts/showdown_login_check.py", "required": true},
      {"label": "report packetizer", "path": "scripts/devstream_packetize.py", "required": true},
      {"label": "post-packet evaluator", "path": "scripts/devstream_post_packet_eval.py", "required": true},
      {"label": "cycle report writer", "path": "scripts/devstream_cycle_report.py", "required": true},
      {"label": "optional remote profile control", "path": "scripts/jigglypuff_devstream_control.py", "required": true},
      {"label": "optional remote runtime worker", "path": "scripts/fouler_jigglypuff_runtime.ps1", "required": false},
      {"label": "optional remote runtime mirror", "path": "devstream/truth/jigglypuff-runtime.json", "required": false, "staleAfterSeconds": 900},
      {"label": "offline eval readiness doctor", "path": "infrastructure/offline_eval_readiness.py", "required": true},
      {"label": "offline eval readiness docs", "path": "docs/OFFLINE_EVAL_READINESS.md", "required": true},
      {"label": "elo proof schema", "path": "devstream/truth/elo-proof.schema.json", "required": true},
      {"label": "elo proof example", "path": "devstream/truth/elo-proof.example.json", "required": true}
    ]
  },
  "obs": {
    "collection": "CrossProjectDevstream",
    "profile": "CrossProjectDevstream",
    "primaryScene": "fouler-play - Battle Lab Main",
    "scenes": ["fouler-play - Battle Lab Main", "fouler-play - Battle Slots"],
    "surfaceAccess": {
      "kind": "ssh-tunnel",
      "servedOn": "JIGGLYPUFF",
      "bind": "127.0.0.1:8777",
      "bindIsLoopbackOnly": true,
      "consumedOn": "RWLEGION",
      "tunnel": "HERMES-BroadcastSourceTunnels",
      "tunnelForward": "-L 127.0.0.1:8777:127.0.0.1:8777 devstream-tunnel@192.168.1.125",
      "remotelyProbeable": false,
      "notes": "The overlay server binds loopback-only on JIGGLYPUFF on purpose; it is never exposed to the LAN. The broadcast node reaches it through the HERMES-BroadcastSourceTunnels SSH forward, so these URLs are correct ONLY on a host carrying that tunnel. The control plane (DEKU) carries no such tunnel and MUST NOT HEAD-probe these URLs -- server liveness is covered by health.command, which runs on the box that can actually see the socket. Do not 'fix' an unreachable surface by widening the bind."
    },
    "surfaces": [
      {"name": "slot 1", "url": "http://127.0.0.1:8777/slot/1?slot_idle=public", "required": true},
      {"name": "slot 2", "url": "http://127.0.0.1:8777/slot/2?slot_idle=public", "required": true},
      {"name": "slot 3", "url": "http://127.0.0.1:8777/slot/3?slot_idle=public", "required": true},
      {"name": "battle lab overlay", "url": "http://127.0.0.1:8777/overlay?mode=bottom&hide_recent=1", "required": true},
      {"name": "health", "url": "http://127.0.0.1:8777/health", "required": true, "captureRequired": false, "operatorOnly": true}
    ]
  },
  "focus": {
    "priority": 90,
    "idleRotationSeconds": 900,
    "reasons": ["1700 ELO target", "bounded battle cycles", "live browser surfaces", "DEKU analysis loop", "report generation proof"]
  },
  "autonomy": {
    "canForeground": true,
    "canAutostartRehearsal": false,
    "canAutostartLive": false,
    "canRunInBackground": false,
    "failClosedWithoutRuntimeLease": true,
    "runtimeLeaseRequiredFor": ["jigglypuff start --execute", "devstream_session start --execute", "devstream_session supervise", "improve_agent --enable-auto-improve", "run.py live ladder"],
    "requiredRuntimeLeaseFields": ["projectId", "leaseId", "machine", "account", "proofWindow.startsAt", "proofWindow.expiresAt", "maxRunCount", "maxCycles", "maxConcurrentBattles", "replayBehavior"],
    "resourceClass": "remote-heavy",
    "minFocusMinutes": 20,
    "maxFocusMinutes": 45,
    "warmupSeconds": 30,
    "allowDegradedStart": false,
    "discordInfluence": "queued-safe-handoff",
    "rotateOn": ["batch-complete", "login-failed", "health-blocked", "report-written", "operator-suggestion"],
    "notes": "Autopilot may run status and dry-run planning only. A bounded Showdown batch on JIGGLYPUFF or any other machine requires a current proof window and runtime lease; no rehearsal autostart is allowed from this manifest."
  },
  "certification": {
    "commands": [
      {"name": "jigglypuff-status", "command": [".venv/bin/python", "scripts/jigglypuff_devstream_control.py", "status"], "timeoutSeconds": 45},
      {"name": "showdown-login-plan", "command": [".venv/bin/python", "scripts/jigglypuff_devstream_control.py", "login-proof"], "timeoutSeconds": 90},
      {"name": "cycle-report", "command": [".venv/bin/python", "scripts/devstream_cycle_report.py", "--write"], "timeoutSeconds": 20},
      {"name": "offline-eval-readiness-no-start", "command": [".venv/bin/python", "infrastructure/offline_eval_readiness.py", "--skip-server-check"], "timeoutSeconds": 30},
      {"name": "packetizer-dry-run", "command": [".venv/bin/python", "scripts/devstream_packetize.py"], "timeoutSeconds": 30}
    ]
  },
  "workPackets": {
    "defaultBranch": "master",
    "allowedPaths": [
      "devstream/",
      "docs/",
      "fp/",
      "infrastructure/",
      "replay_analysis/",
      "scripts/",
      "streaming/",
      "tests/",
      "run.py"
    ],
    "validation": [
      ".venv/bin/python -m py_compile scripts/devstream_session.py scripts/devstream_packetize.py scripts/devstream_post_packet_eval.py scripts/showdown_login_check.py scripts/devstream_cycle_report.py",
      ".venv/bin/python -m py_compile scripts/jigglypuff_devstream_control.py",
      ".venv/bin/python -m py_compile scripts/devstream_health.py streaming/serve_obs_page.py",
      ".venv/bin/python scripts/jigglypuff_devstream_control.py status",
      ".venv/bin/python scripts/devstream_session.py doctor",
      ".venv/bin/python scripts/devstream_cycle_report.py --write",
      ".venv/bin/python infrastructure/offline_eval_readiness.py --skip-server-check",
      ".venv/bin/python scripts/showdown_login_check.py",
      ".venv/bin/python -m pytest tests/test_offline_eval_readiness.py tests/test_devstream_health_readiness.py -q",
      ".venv/bin/python -m pytest tests/test_autoresearch.py tests/test_loss_learning_guardrails.py tests/test_pokedex_oracle.py tests/test_threat_bias.py -q",
      ".venv/bin/python -m pytest tests/test_hybrid_dashboard.py tests/test_state_endpoint_status.py"
    ]
  }
}
