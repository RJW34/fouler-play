{
  "schemaVersion": "devstream-project/v1",
  "projectId": "fouler-play",
  "displayName": "fouler-play",
  "root": "/home/ryan/projects/fouler-play",
  "role": "bounded-cycle-runner",
  "machine": "ubunztu",
  "mission": "Train and evaluate a high-level Gen 9 OU bot through live bounded battle cycles, replay/decision proof, DEKU-guided analysis, and iteration toward 1800+ ELO play.",
  "runner": {
    "safeToAutostart": false,
    "start": [".venv/bin/python", "scripts/devstream_session.py", "start", "--run-count", "25", "--max-concurrent-battles", "2", "--execute"],
    "stop": [".venv/bin/python", "scripts/devstream_session.py", "stop", "--execute"],
    "status": [".venv/bin/python", "scripts/devstream_health.py"]
  },
  "health": {
    "command": [".venv/bin/python", "scripts/devstream_health.py"],
    "timeoutSeconds": 10
  },
  "truth": {
    "files": [
      {"label": "health probe", "path": "scripts/devstream_health.py", "required": true},
      {"label": "stream status", "path": "stream_status.json", "required": false, "staleAfterSeconds": 21600},
      {"label": "daily stats", "path": "daily_stats.json", "required": false, "staleAfterSeconds": 21600},
      {"label": "active battles", "path": "active_battles.json", "required": false, "staleAfterSeconds": 1800},
      {"label": "battle stats", "path": "battle_stats.json", "required": false},
      {"label": "autoresearch json", "path": "replay_analysis/autoresearch_latest.json", "required": false, "staleAfterSeconds": 86400},
      {"label": "autoresearch report", "path": "replay_analysis/reports/autoresearch_latest.md", "required": false, "staleAfterSeconds": 86400},
      {"label": "bounded session planner", "path": "scripts/devstream_session.py", "required": true},
      {"label": "report packetizer", "path": "scripts/devstream_packetize.py", "required": true},
      {"label": "elo proof schema", "path": "devstream/truth/elo-proof.schema.json", "required": true},
      {"label": "elo proof example", "path": "devstream/truth/elo-proof.example.json", "required": true}
    ]
  },
  "obs": {
    "collection": "CrossProjectDevstream",
    "profile": "CrossProjectDevstream",
    "primaryScene": "fouler-play - Hybrid Main",
    "scenes": ["fouler-play - Hybrid Main", "fouler-play - Dashboard Focus"],
    "surfaces": [
      {"name": "slot 1", "url": "http://127.0.0.1:8777/slot/1", "required": true},
      {"name": "slot 2", "url": "http://127.0.0.1:8777/slot/2", "required": false},
      {"name": "slot 3", "url": "http://127.0.0.1:8777/slot/3", "required": false},
      {"name": "hybrid overlay", "url": "http://127.0.0.1:8777/overlay/hybrid", "required": true},
      {"name": "hybrid dashboard", "url": "http://127.0.0.1:8777/dashboard/hybrid", "required": true},
      {"name": "health", "url": "http://127.0.0.1:8777/health", "required": true}
    ]
  },
  "focus": {
    "priority": 90,
    "idleRotationSeconds": 900,
    "reasons": ["1800 ELO target", "bounded battle cycles", "live browser surfaces", "DEKU analysis loop", "report generation proof"]
  },
  "workPackets": {
    "defaultBranch": "main",
    "allowedPaths": [
      "devstream/",
      "docs/",
      "fp/",
      "infrastructure/",
      "replay_analysis/",
      "scripts/",
      "streaming/",
      "tests/",
      "run.py"
    ],
    "validation": [
      ".venv/bin/python -m py_compile scripts/devstream_session.py scripts/devstream_packetize.py",
      ".venv/bin/python -m py_compile scripts/devstream_health.py streaming/serve_obs_page.py",
      ".venv/bin/python scripts/devstream_health.py",
      ".venv/bin/python scripts/devstream_session.py doctor",
      ".venv/bin/python -m pytest tests/test_hybrid_dashboard.py tests/test_state_endpoint_status.py"
    ]
  }
}
