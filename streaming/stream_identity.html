<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEKU Stream Identity</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0a0a14;
  --accent-gold: #f59e0b;
  --accent-gold-dim: rgba(245,158,11,0.15);
  --accent-green: #4ade80;
  --accent-red: #f87171;
  --accent-blue: #60a5fa;
  --glass-border: rgba(255,255,255,0.08);
  --text-main: #eaeaea;
  --text-dim: #666;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:640px; height:480px; overflow:hidden;
  background: radial-gradient(ellipse at 50% 0%, rgba(245,158,11,0.08) 0%, var(--bg-dark) 60%);
  font-family:'Outfit',sans-serif; color:var(--text-main);
  display:flex; flex-direction:column; align-items:center;
  justify-content:space-between;
  padding: 24px 28px 20px;
}

/* Scanlines overlay */
body::before {
  content:''; position:fixed; inset:0; z-index:999; pointer-events:none;
  background-image: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(245,158,11,0.015) 2px, rgba(245,158,11,0.015) 4px
  );
}

/* ─── TOP: Stream title ─── */
.stream-title {
  text-align:center;
  width:100%;
}
.deku-wordmark {
  font-size:48px; font-weight:900; letter-spacing:6px;
  text-transform:uppercase;
  background: linear-gradient(135deg, #f59e0b 0%, #fde68a 50%, #f59e0b 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(245,158,11,0.5));
  line-height:1;
}
.deku-subtitle {
  font-size:11px; font-weight:600; letter-spacing:4px;
  text-transform:uppercase; color:var(--text-dim);
  margin-top:6px;
}

/* ─── MIDDLE: Agent status trio ─── */
.agents {
  width:100%;
  display:flex; flex-direction:column; gap:8px;
}
.agent-row {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--glass-border);
  border-radius:10px;
  padding:8px 14px;
}
.agent-dot {
  width:8px; height:8px; border-radius:50%;
  flex-shrink:0;
}
.agent-dot.green  { background:#4ade80; box-shadow:0 0 8px #4ade80; }
.agent-dot.red    { background:#f87171; box-shadow:0 0 8px #f87171; }
.agent-dot.yellow { background:#fbbf24; box-shadow:0 0 8px #fbbf24; }
.agent-dot.dim    { background:#444; }
.agent-name {
  font-size:12px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; min-width:72px;
}
.agent-name.green  { color:#4ade80; }
.agent-name.red    { color:#f87171; }
.agent-name.yellow { color:#fbbf24; }
.agent-name.dim    { color:#555; }
.agent-desc {
  font-size:11px; color:var(--text-dim);
  flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.agent-status {
  font-size:10px; font-weight:600; letter-spacing:1px;
  text-transform:uppercase; margin-left:auto;
  padding:2px 8px; border-radius:6px;
}
.agent-status.live    { color:#4ade80; background:rgba(74,222,128,0.12); border:1px solid rgba(74,222,128,0.3); }
.agent-status.init    { color:#fbbf24; background:rgba(251,191,36,0.12); border:1px solid rgba(251,191,36,0.3); }
.agent-status.offline { color:#555;    background:rgba(80,80,80,0.12);   border:1px solid rgba(80,80,80,0.3); }

/* ─── BOTTOM: ELO + battle count ─── */
.stats-bar {
  width:100%;
  display:flex; align-items:center; justify-content:space-between;
  border-top:1px solid var(--glass-border);
  padding-top:14px;
}
.elo-block {
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.elo-label {
  font-size:10px; font-weight:600; letter-spacing:2px;
  text-transform:uppercase; color:var(--text-dim);
}
.elo-value {
  font-size:28px; font-weight:900; letter-spacing:2px;
  color:var(--accent-gold);
  text-shadow:0 0 20px rgba(245,158,11,0.6);
  font-variant-numeric:tabular-nums;
}
.divider { width:1px; height:36px; background:var(--glass-border); }
.stat-block {
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.stat-label {
  font-size:10px; font-weight:600; letter-spacing:2px;
  text-transform:uppercase; color:var(--text-dim);
}
.stat-value {
  font-size:22px; font-weight:800; letter-spacing:1px;
  font-variant-numeric:tabular-nums;
}
.stat-value.wins  { color:var(--accent-green); }
.stat-value.losses { color:var(--accent-red); }
.stat-value.battles { color:var(--accent-blue); }
</style>
</head>
<body>

<!-- Stream title -->
<div class="stream-title">
  <div class="deku-wordmark">DEKU</div>
  <div class="deku-subtitle">AI Pokémon Lab • Live</div>
</div>

<!-- Agent status -->
<div class="agents" id="agents">
  <div class="agent-row">
    <div class="agent-dot green"></div>
    <div class="agent-name green">Lucario</div>
    <div class="agent-desc">fouler-play • Gen9 OU ladder</div>
    <div class="agent-status live" id="lucario-status">LIVE</div>
  </div>
  <div class="agent-row">
    <div class="agent-dot yellow"></div>
    <div class="agent-name yellow">Porygon-Z</div>
    <div class="agent-desc">emerald-ai • Pokémon Emerald</div>
    <div class="agent-status init" id="porygonz-status">INIT</div>
  </div>
  <div class="agent-row">
    <div class="agent-dot red"></div>
    <div class="agent-name red">Rotom</div>
    <div class="agent-desc">fire-red-ai • Pokémon Fire Red</div>
    <div class="agent-status init" id="rotom-status">INIT</div>
  </div>
</div>

<!-- ELO + stats -->
<div class="stats-bar">
  <div class="elo-block">
    <div class="elo-label">Current ELO</div>
    <div class="elo-value" id="elo">—</div>
  </div>
  <div class="divider"></div>
  <div class="stat-block">
    <div class="stat-label">Wins</div>
    <div class="stat-value wins" id="wins">—</div>
  </div>
  <div class="divider"></div>
  <div class="stat-block">
    <div class="stat-label">Losses</div>
    <div class="stat-value losses" id="losses">—</div>
  </div>
  <div class="divider"></div>
  <div class="stat-block">
    <div class="stat-label">Battles</div>
    <div class="stat-value battles" id="total">—</div>
  </div>
</div>

<script>
async function fetchState() {
  try {
    const r = await fetch('/magneton-state');
    if (!r.ok) return;
    const d = await r.json();

    // ELO
    if (d.elo) document.getElementById('elo').textContent = d.elo;

    // Win/loss from battle stats
    if (d.wins  !== undefined) document.getElementById('wins').textContent   = d.wins;
    if (d.losses!== undefined) document.getElementById('losses').textContent = d.losses;
    if (d.total !== undefined) document.getElementById('total').textContent  = d.total;

    // Agent statuses
    if (d.lucario_status)   updateAgent('lucario-status',   d.lucario_status);
    if (d.porygonz_status)  updateAgent('porygonz-status',  d.porygonz_status);
    if (d.rotom_status)     updateAgent('rotom-status',      d.rotom_status);
  } catch(e) {}
}

function updateAgent(id, status) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = status.toUpperCase();
  el.className = 'agent-status ' + (
    status === 'live' ? 'live' :
    status === 'init' ? 'init' : 'offline'
  );
}

fetchState();
setInterval(fetchState, 5000);
</script>
</body>
</html>
