<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Battle Lab Match __SLOT__</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#08090d;color:#f4f1e8;
font-family:Inter,Segoe UI,system-ui,sans-serif}
.shell{width:1280px;height:720px;padding:28px;display:grid;grid-template-rows:74px 1fr 76px;gap:18px}
.top{display:grid;grid-template-columns:1fr auto;align-items:start;border-bottom:1px solid #2b3040;padding-bottom:16px}
.kicker{font-size:14px;font-weight:800;color:#58c7d9;text-transform:uppercase}
.title{font-size:42px;line-height:46px;font-weight:900;color:#fff;margin-top:2px}
.status{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.pill{min-width:118px;padding:10px 14px;border:1px solid #3b4252;border-radius:7px;background:#121722;color:#f4f1e8;text-align:center}
.pill strong{display:block;font-size:20px;line-height:24px}
.pill span{display:block;font-size:11px;color:#a8b3c7;text-transform:uppercase}
.main{display:grid;grid-template-columns:472px 1fr;gap:22px;min-height:0}
.panel{border:1px solid #2b3040;border-radius:8px;background:#11151d;padding:20px;min-height:0}
.match{display:grid;grid-template-rows:auto auto 1fr;gap:18px}
.label{font-size:12px;color:#a8b3c7;text-transform:uppercase;font-weight:800;margin-bottom:8px}
.opponent{font-size:38px;line-height:42px;font-weight:900;color:#fff;word-break:break-word}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric{border-left:4px solid #58c7d9;background:#171d28;padding:12px}
.metric b{display:block;font-size:24px;line-height:30px;color:#fff}
.metric span{font-size:12px;color:#a8b3c7;text-transform:uppercase}
.match-note{align-self:end;font-size:15px;line-height:20px;color:#d5c46a}
.events{display:grid;grid-template-rows:auto 1fr;gap:12px}
.event-list{display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:0}
.event{display:grid;grid-template-columns:52px 1fr;gap:10px;min-height:48px;max-height:66px;padding:10px 12px;border-radius:6px;background:#171d28;border-left:4px solid #d56b5f;color:#f1f5f9;font-size:17px;line-height:23px;overflow:hidden}
.event.win-row{border-left-color:#7bd88f}.event.loss-row{border-left-color:#d56b5f}
.event em{font-style:normal;color:#d5c46a;font-weight:800}
.event span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.empty{height:100%;display:flex;align-items:center;justify-content:center;border:1px dashed #3b4252;border-radius:8px;color:#a8b3c7;font-size:24px;font-weight:800;text-align:center;padding:24px}
.bottom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.result{height:76px;border:1px solid #2b3040;border-radius:7px;background:#11151d;padding:10px 12px;min-width:0;overflow:hidden}
.result b{display:block;font-size:18px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .outcome{display:block;font-size:12px;text-transform:uppercase;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .result-meta{display:block;font-size:12px;color:#a8b3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win{color:#7bd88f}.loss{color:#d56b5f}.pending{color:#d5c46a}
.idle .shell{grid-template-rows:74px 1fr}.idle .bottom{display:none}.idle .main{grid-template-columns:1fr 1fr}
</style></head><body>
<main class="shell">
  <section class="top">
    <div>
      <div class="kicker">Pokemon Showdown / Ranked match __SLOT__</div>
      <div class="title" id="headline">Battle Lab ready</div>
    </div>
    <div class="status">
      <div class="pill"><strong id="turn">--</strong><span>Turn</span></div>
      <div class="pill"><strong id="record">0-0</strong><span>Session</span></div>
      <div class="pill"><strong>GEN 9 OU</strong><span>Format</span></div>
    </div>
  </section>
  <section class="main">
    <div class="panel match">
      <div>
        <div class="label">Current matchup</div>
        <div class="opponent" id="opponent">Finding an opponent</div>
      </div>
      <div class="meta">
        <div class="metric"><b id="status">Matchmaking</b><span>State</span></div>
        <div class="metric"><b id="age">--</b><span>Battle time</span></div>
      </div>
      <div class="match-note" id="matchNote">Gen 9 OU ranked ladder</div>
    </div>
    <div class="panel events">
      <div class="label" id="timelineLabel">Battle timeline</div>
      <div class="event-list" id="events"><div class="empty">Match updates will appear here.</div></div>
    </div>
  </section>
  <section class="bottom" id="results"></section>
</main>
<script>
(function(){
  var SLOT=__SLOT__;
  var STATE_URL='/slot/'+SLOT+'/state';
  var POLL_MS=3000;

  function text(id,value){document.getElementById(id).textContent=value==null?'--':String(value);}
  function make(tag,className,value){
    var node=document.createElement(tag);
    if(className){node.className=className;}
    if(value!=null){node.textContent=String(value);}
    return node;
  }
  function words(value){
    return String(value||'').trim().replace(/[-_]+/g,' ').replace(/\s+/g,' ');
  }
  function titleWords(value){
    return words(value).toLowerCase().replace(/\b[a-z]/g,function(letter){return letter.toUpperCase();});
  }
  function sentenceWords(value){
    var clean=words(value).toLowerCase();
    return clean?clean.charAt(0).toUpperCase()+clean.slice(1):'';
  }
  function friendlyToken(value){
    var key=String(value||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
    var known={nastyplot:'Nasty Plot',assaultvest:'Assault Vest'};
    return known[key]||titleWords(value);
  }
  function friendlyStatus(value,active){
    if(active){return 'In battle';}
    var clean=String(value||'').trim();
    var key=clean.toLowerCase();
    if(!clean||/search|queue|matchmak|running|active battle/.test(key)){return 'Matchmaking';}
    if(/ready|idle/.test(key)){return 'Ready';}
    if(/complete|finish/.test(key)){return 'Complete';}
    return titleWords(clean);
  }
  function normalizeEvent(event){
    var value=String(event==null?'':event).trim().replace(/\s+/g,' ');
    if(!value){return '';}

    var archetype=value.match(/^Archetype=(?:[A-Za-z][A-Za-z0-9]*\.)?([A-Z0-9_]+)(?:,\s*Confidence=([0-9]*\.?[0-9]+))?$/i);
    if(archetype){
      var read='Battle read: '+sentenceWords(archetype[1]);
      if(archetype[2]){
        var confidence=Number(archetype[2]);
        if(isFinite(confidence)){
          read+=' ('+Math.round(confidence<=1?confidence*100:confidence)+'% confidence)';
        }
      }
      return read;
    }

    var winCondition=value.match(/^Win Condition:\s*(.+)$/i);
    if(winCondition){
      var condition=winCondition[1]
        .replace(/\bthrough defensive core\b/i,'through the defensive core')
        .replace(/,\s*wear with\b/i,'; win with');
      return 'Win condition: '+condition;
    }

    var decision=value.match(/^Bot selected\s+(.+)$/i);
    if(decision){
      var action=decision[1].replace(/^Move\s+/i,'').trim();
      action=action.replace(/^Switch\s+(?!to\b)/i,'Switch to ');
      return 'Decision: '+action;
    }

    var switched=value.match(/^(.+?) switched in(?:\s*\((.*?)\))?$/i);
    if(switched){
      var actor=switched[1].trim();
      var details=String(switched[2]||'').trim();
      if(!details||actor.toLowerCase()===details.toLowerCase()){
        return actor+' switched in';
      }
      return actor+' switched in as '+details;
    }

    var move=value.match(/^(.+?) used (.+?) into (.+)$/i);
    if(move){return move[1]+' used '+move[2]+' on '+move[3];}

    var trackedMove=value.match(/^(.+?) already has the move (.+?)\.\s*Decrementing the PP by 1$/i);
    if(trackedMove){
      return titleWords(trackedMove[1])+' used '+friendlyToken(trackedMove[2])+'; one use tracked';
    }

    var ruledOutItem=value.match(/^(.+?) used a status[- ]move\.\s*Adding (.+?) to impossible items$/i);
    if(ruledOutItem){
      var item=String(ruledOutItem[2]||'').replace(/[`'\"]/g,'');
      return titleWords(ruledOutItem[1])+' used a status move; '+friendlyToken(item)+' is ruled out';
    }

    var status=value.match(/^(.+?) status:\s*(brn|psn|tox|par|slp|frz)$/i);
    if(status){
      var statusNames={brn:'burned',psn:'poisoned',tox:'badly poisoned',par:'paralyzed',slp:'asleep',frz:'frozen'};
      return status[1]+' is '+statusNames[status[2].toLowerCase()];
    }

    value=value.replace(/\b[A-Za-z][A-Za-z0-9]*\.([A-Z][A-Z0-9_]+)\b/g,function(_,token){
      return sentenceWords(token);
    });
    return value.replace(/\s*\(\s*\)\s*$/,'').replace(/\s+/g,' ').trim();
  }
  function friendlyTeam(value){
    var raw=String(value||'').trim().replace(/\\/g,'/');
    var key=raw.split('/').pop().replace(/\.[^.]+$/,'');
    key=key
      .replace(/^(?:fat[-_\s]*)?team[-_\s]*\d+[-_\s]*/i,'')
      .replace(/^team[-_\s]+/i,'');
    var label=titleWords(key);
    if(!label){return 'Current team';}
    return /\bteam$/i.test(label)?label:label+' team';
  }
  function replayStatus(value){
    var key=words(value).toLowerCase();
    if(!key){return 'Replay pending';}
    if(/pending/.test(key)&&/upload|public/.test(key)){return 'Replay processing';}
    if(/public|verified|ready|uploaded|available/.test(key)){return 'Replay ready';}
    if(/absent|missing|none/.test(key)){return 'No replay available';}
    if(/private|failed|error|unavailable/.test(key)){return 'Replay unavailable';}
    if(/not requested/.test(key)){return 'Replay not requested';}
    return 'Replay '+sentenceWords(key);
  }
  function resultClass(result){
    var key=String(result||'').toLowerCase();
    return key==='win'?'win':(key==='loss'?'loss':'pending');
  }
  function resultLabel(result,delta){
    var key=String(result||'').trim().toLowerCase();
    var outcome=key==='win'?'WIN':(key==='loss'?'LOSS':(key?titleWords(key).toUpperCase():'RESULT'));
    var number=Number(delta);
    if(delta!=null&&delta!==''&&isFinite(number)){
      outcome+=' / '+(number>0?'+':'')+number+' ELO';
    }
    return outcome;
  }
  function renderEvents(events,active,recentResults){
    var root=document.getElementById('events');
    var fragment=document.createDocumentFragment();
    var normalized=(events||[]).map(normalizeEvent).filter(function(event){return !!event;}).slice(-7);
    if(!active&&!normalized.length){
      (recentResults||[]).slice(0,6).forEach(function(result){
        var row=make('div','event '+(resultClass(result.result)==='win'?'win-row':'loss-row'));
        row.appendChild(make('em','',String(result.result||'').toUpperCase()));
        row.appendChild(make('span','',(result.opponent?'vs '+result.opponent:'Opponent unavailable')+' / '+resultLabel(result.result,result.delta)));
        fragment.appendChild(row);
      });
    }
    if(!normalized.length){
      if(!fragment.childNodes.length){fragment.appendChild(make('div','empty',active?'Waiting for the first battle update.':'Searching the Gen 9 OU ladder.'));}
    }else{
      normalized.forEach(function(event,idx){
        var row=make('div','event');
        row.appendChild(make('em','',String(idx+1).padStart(2,'0')));
        row.appendChild(make('span','',event));
        fragment.appendChild(row);
      });
    }
    root.replaceChildren(fragment);
  }
  function resultCard(result){
    var card=make('div','result');
    card.appendChild(make('span','outcome '+resultClass(result.result),resultLabel(result.result,result.delta)));
    card.appendChild(make('b','',result.opponent?'vs '+result.opponent:'Opponent unavailable'));
    card.appendChild(make('span','result-meta',friendlyTeam(result.team)+' / '+replayStatus(result.replay)));
    return card;
  }
  function pendingResultCard(){
    var card=make('div','result');
    card.appendChild(make('span','outcome pending','NEXT'));
    card.appendChild(make('b','','Next result'));
    card.appendChild(make('span','result-meta','Waiting for a completed battle'));
    return card;
  }
  function renderResults(results){
    var root=document.getElementById('results');
    var fragment=document.createDocumentFragment();
    var visible=(results||[]).slice(0,4);
    visible.forEach(function(result){fragment.appendChild(resultCard(result));});
    for(var idx=visible.length;idx<4;idx+=1){fragment.appendChild(pendingResultCard());}
    root.replaceChildren(fragment);
  }
  function render(payload){
    var lab=payload.battle_lab||payload;
    var active=!!lab.active;
    document.body.classList.toggle('idle',!active);
    text('headline',active?'Live Battle Lab':'Battle Lab ready');
    text('turn',lab.turn==null?'--':lab.turn);
    text('record',(lab.wins||0)+'-'+(lab.losses||0));
    text('opponent',active?('vs '+(lab.opponent||'Opponent unavailable')):'Finding an opponent');
    text('status',friendlyStatus(lab.status,active));
    text('age',active?(lab.age_label||'--'):'--');
    text('matchNote',active?'Gen 9 OU ranked match in progress':'Gen 9 OU ranked ladder');
    text('timelineLabel',active?'Battle timeline':'Recent form');
    renderEvents(lab.events||[],active,lab.recent_results||[]);
    renderResults(lab.recent_results||[]);
  }
  function poll(){
    fetch(STATE_URL+'?t='+Date.now(),{cache:'no-store'})
      .then(function(response){if(!response.ok){throw new Error('state unavailable');}return response.json();})
      .then(render)
      .catch(function(){text('status','Reconnecting');});
  }
  poll();
  setInterval(poll,POLL_MS);
})();
</script>
</body></html>
