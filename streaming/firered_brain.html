<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fire Red AI Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0f0f1b;
  --bg-card: rgba(255,255,255,0.04);
  --accent-green: #f87171;
  --accent-emerald: #ef4444;
  --glass-border: rgba(255,255,255,0.1);
  --text-main: #eaeaea;
  --text-dim: #888;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:640px;height:540px;overflow:hidden;
  background:radial-gradient(circle at center, #1f0d0d 0%, var(--bg-dark) 100%);
  font-family:'Outfit',sans-serif;color:var(--text-main);
  display:flex;flex-direction:column;
}

/* Scanlines */
body::before{
  content:'';position:fixed;inset:0;z-index:999;pointer-events:none;
  background-image:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(248,113,113,0.02) 2px,rgba(248,113,113,0.02) 4px
  );
}

.header{
  display:flex;align-items:center;gap:10px;
  padding:16px 20px 8px;
}
.badge{
  padding:5px 14px;border-radius:18px;
  font-size:11px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;
  background:rgba(0,0,0,0.4);
  border:1px solid var(--accent-green);
  color:var(--accent-green);
  box-shadow:0 0 12px rgba(248,113,113,0.25);
}
.status-text{
  font-size:12px;color:var(--text-dim);
  margin-left:auto;letter-spacing:1px;
}

/* Main content area */
.brain-content{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;gap:16px;
}

/* Pulse ring */
.pulse-ring{
  width:120px;height:120px;position:relative;
}
.pulse-ring .core{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:40px;height:40px;border-radius:50%;
  background:rgba(239,68,68,0.15);
  border:2px solid var(--accent-emerald);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 0 20px rgba(239,68,68,0.3);
}
.pulse-ring .ring{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  border:1px solid var(--accent-green);
  border-radius:50%;opacity:0;
  animation:pulse-out 3s ease-out infinite;
}
.pulse-ring .ring:nth-child(2){animation-delay:1s}
.pulse-ring .ring:nth-child(3){animation-delay:2s}
@keyframes pulse-out{
  0%{width:40px;height:40px;opacity:0.6}
  100%{width:120px;height:120px;opacity:0}
}

.title{
  font-size:22px;font-weight:800;
  letter-spacing:4px;text-transform:uppercase;
  color:var(--accent-green);
  text-shadow:0 0 20px rgba(248,113,113,0.4);
  animation:title-pulse 2.5s ease-in-out infinite;
}
@keyframes title-pulse{0%,100%{opacity:1}50%{opacity:0.6}}

.subtitle{
  font-size:12px;color:var(--text-dim);
  letter-spacing:3px;text-transform:uppercase;
}

/* Info cards (for future data) */
.info-cards{
  width:100%;display:flex;flex-direction:column;gap:8px;
  padding:0 20px;
}
.info-card{
  background:var(--bg-card);
  border:1px solid var(--glass-border);
  border-radius:10px;padding:10px 16px;
  display:flex;justify-content:space-between;align-items:center;
}
.info-card .lbl{font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase}
.info-card .val{font-size:14px;font-weight:600;color:var(--accent-green)}
.info-card .val.dim{color:var(--text-dim);font-style:italic}

/* Status bar */
.status-bar{
  margin-top:auto;
  padding:8px 20px;
  background:rgba(0,0,0,0.4);
  border-top:1px solid var(--glass-border);
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--text-dim);
}
.status-dot{
  width:6px;height:6px;border-radius:50%;
  display:inline-block;margin-right:6px;
  animation:dot-blink 1.5s ease-in-out infinite;
}
@keyframes dot-blink{
  0%,100%{background:var(--accent-emerald);box-shadow:0 0 6px var(--accent-emerald)}
  50%{background:#555;box-shadow:none}
}
</style>
</head>
<body>
<div class="header">
  <div class="badge">🔥 FIRE RED AI</div>
  <div class="status-text" id="statusText">INITIALIZING</div>
</div>

<div class="brain-content" id="initView">
  <div class="pulse-ring">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="core">🔥</div>
  </div>
  <div class="title" id="mainTitle">INITIALIZING</div>
  <div class="subtitle" id="mainSub">Awaiting connection to Fire Red ROM</div>
</div>

<div class="info-cards" id="infoCards">
  <div class="info-card">
    <div class="lbl">Objective</div>
    <div class="val dim" id="objective">Waiting...</div>
  </div>
  <div class="info-card">
    <div class="lbl">Last Action</div>
    <div class="val dim" id="lastAction">---</div>
  </div>
  <div class="info-card">
    <div class="lbl">Location</div>
    <div class="val dim" id="location">---</div>
  </div>
</div>

<div class="status-bar">
  <div><span class="status-dot"></span><span id="connText">Standby</span></div>
  <div id="lastUpdate">--</div>
</div>

<script>
const STATE_URL = '/firered-brain-state';
const REFRESH_MS = 3000;

async function fetchState() {
  try {
    const resp = await fetch(STATE_URL + '?t=' + Date.now(), {cache:'no-store'});
    if (!resp.ok) return;
    const data = await resp.json();
    if (data && data.status !== 'initializing') {
      render(data);
    }
  } catch(e) {}
}

function render(data) {
  if (data.objective) document.getElementById('objective').textContent = data.objective;
  if (data.last_action) document.getElementById('lastAction').textContent = data.last_action;
  if (data.location) document.getElementById('location').textContent = data.location;
  if (data.title) {
    document.getElementById('mainTitle').textContent = data.title;
    document.getElementById('mainTitle').style.animation = 'none';
  }
  if (data.subtitle) document.getElementById('mainSub').textContent = data.subtitle;
  if (data.status_text) document.getElementById('statusText').textContent = data.status_text;
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
}

fetchState();
setInterval(fetchState, REFRESH_MS);
</script>
</body>
</html>
