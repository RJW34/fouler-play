<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fire Red AI Brain</title>
<style>
:root {
  --bg: #1a0a0a;
  --accent: #f87171;
  --accent2: #ef4444;
  --dim: #7a5a5a;
  --text: #f4d4d4;
  --text-dim: #9a7a7a;
  --card-bg: rgba(248,113,113,0.06);
  --border: rgba(248,113,113,0.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:640px;height:220px;overflow:hidden;
  background:linear-gradient(135deg, #1a0909 0%, #1a0a0f 50%, #120707 100%);
  font-family:system-ui,-apple-system,sans-serif;
  color:var(--text);
}

.header{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px 6px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.3);
}
.game-name{
  font-size:15px;font-weight:700;letter-spacing:2px;
  color:var(--accent);text-transform:uppercase;
}
.game-icon{font-size:16px;line-height:1}
.status-pill{
  display:flex;align-items:center;gap:5px;
  margin-left:auto;
  padding:2px 10px;border-radius:20px;
  background:rgba(0,0,0,0.4);
  border:1px solid var(--border);
  font-size:10px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--text-dim);
}
.status-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--dim);
  flex-shrink:0;
}
.status-dot.running{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.status-dot.stuck{background:#60a5fa;box-shadow:0 0 6px #60a5fa}
.status-dot.idle{background:#fbbf24;box-shadow:0 0 4px #fbbf24}

.body{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  height:138px;
}

.left-col{
  padding:8px 12px 8px 14px;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;
}
.right-col{
  padding:8px 14px 8px 12px;
  display:flex;flex-direction:column;gap:6px;
}

.field{display:flex;flex-direction:column;gap:1px}
.field-lbl{
  font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-dim);font-weight:600;
}
.field-val{
  font-size:13px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;
}
.field-val.accent{color:var(--accent);font-weight:600}
.field-val.dim{color:var(--text-dim);font-style:italic}

.footer{
  display:flex;align-items:center;gap:12px;
  padding:5px 14px;
  background:rgba(0,0,0,0.35);
  border-top:1px solid var(--border);
  font-size:10px;color:var(--text-dim);
}
.footer-sep{opacity:0.3}
.footer .val{color:var(--accent);font-weight:600}
.upd{margin-left:auto;font-size:9px;opacity:0.5}
</style>
</head>
<body>

<div class="header">
  <span class="game-icon">🔴</span>
  <span class="game-name">Pokémon Fire Red</span>
  <div class="status-pill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusLabel">—</span>
  </div>
</div>

<div class="body">
  <div class="left-col">
    <div class="field">
      <div class="field-lbl">📍 Location</div>
      <div class="field-val accent" id="location">—</div>
    </div>
    <div class="field">
      <div class="field-lbl">⚡ Last Action</div>
      <div class="field-val" id="lastAction">—</div>
    </div>
  </div>
  <div class="right-col">
    <div class="field">
      <div class="field-lbl">🎯 Objective</div>
      <div class="field-val" id="objective" style="white-space:normal;line-height:1.3;font-size:12px">—</div>
    </div>
  </div>
</div>

<div class="footer">
  <span>🥊 Badges: <span class="val" id="badges">0</span></span>
  <span class="footer-sep">|</span>
  <span>🐾 Party: <span class="val" id="party">0</span></span>
  <span class="upd" id="lastUpdate">--:--</span>
</div>

<script>
const STATE_URL = '/firered-brain-state';
const REFRESH_MS = 5000;

function truncate(str, n) {
  if (!str) return '—';
  return str.length > n ? str.slice(0, n) + '…' : str;
}

function statusClass(status) {
  const s = (status || '').toLowerCase();
  if (s.includes('stuck')) return 'stuck';
  if (s === 'idle' || s === 'initializing' || s === 'intro') return 'idle';
  return 'running';
}

async function fetchState() {
  try {
    const resp = await fetch(STATE_URL + '?t=' + Date.now(), {cache:'no-store'});
    if (!resp.ok) return;
    const data = await resp.json();
    render(data);
  } catch(e) {}
}

function render(data) {
  const loc = data.location || '—';
  const action = truncate(data.last_action, 42);
  const obj = truncate(data.objective || data.title, 70);
  const status = data.status || '';
  const statusTxt = data.status_text || status.toUpperCase() || '—';
  const badges = (data.progress && data.progress.badges != null) ? data.progress.badges : '?';
  const party = (data.progress && data.progress.party != null) ? data.progress.party : '?';

  document.getElementById('location').textContent = loc;
  document.getElementById('lastAction').textContent = action;
  document.getElementById('objective').textContent = obj;
  document.getElementById('statusLabel').textContent = statusTxt;
  document.getElementById('badges').textContent = badges;
  document.getElementById('party').textContent = party;

  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + statusClass(status);

  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

fetchState();
setInterval(fetchState, REFRESH_MS);
</script>
</body>
</html>
