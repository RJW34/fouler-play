<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Fouler Play - Three Battle Vertical</title>
  <style>
    :root {
      --ink: #07090b;
      --panel: #121619;
      --panel-raised: #1a2024;
      --line: #374047;
      --paper: #f7f4ea;
      --muted: #aeb8bd;
      --teal: #38c7b5;
      --amber: #f1c75b;
      --coral: #ef7067;
      --green: #6ed58b;
      --ready: #8fc5ff;
      --idle: #77838a;
      --social-safe-top: 96px;
      --social-safe-right: 120px;
      --social-safe-bottom: 176px;
      --social-safe-left: 56px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    body { min-width: 1080px; min-height: 1920px; }

    .broadcast {
      width: 1080px;
      height: 1920px;
      padding: var(--social-safe-top) var(--social-safe-right) var(--social-safe-bottom) var(--social-safe-left);
      display: grid;
      grid-template-rows: 120px minmax(0, 1fr) 80px;
      gap: 16px;
      background: var(--ink);
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 438px;
      align-items: stretch;
      border-top: 7px solid var(--amber);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
      padding: 14px 18px 11px 0;
    }

    .brand h1 {
      margin: 0;
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 49px;
      line-height: 50px;
      font-stretch: condensed;
      font-weight: 800;
      text-transform: uppercase;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 16px;
      line-height: 21px;
      text-transform: uppercase;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1.18fr;
      border-left: 1px solid var(--line);
    }

    .score {
      min-width: 0;
      padding: 18px 12px 10px;
      border-right: 1px solid var(--line);
      text-align: center;
    }

    .score:last-child { border-right: 0; }

    .score span {
      display: block;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 13px;
      line-height: 18px;
      text-transform: uppercase;
    }

    .score strong {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--paper);
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 34px;
      line-height: 38px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score.live strong { color: var(--teal); }

    .metrics-state {
      display: block;
      min-height: 14px;
      margin-top: 1px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 12px;
      font-style: normal;
      line-height: 14px;
      text-transform: uppercase;
    }

    .scoreboard.metrics-current .metrics-state { color: var(--teal); }
    .scoreboard.metrics-stale .metrics-state { color: var(--amber); }
    .scoreboard.metrics-unavailable .metrics-state { color: var(--coral); }
    .scoreboard.metrics-stale .score.live strong { color: var(--amber); }
    .scoreboard.metrics-unavailable .score.live strong { color: var(--muted); }

    .matches {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .match {
      min-height: 0;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
    }

    .match-rail {
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      padding: 15px 0 13px;
      border-right: 1px solid var(--line);
      background: #0d1012;
    }

    .match-number {
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 30px;
      line-height: 32px;
      font-weight: 800;
    }

    .status-line {
      width: 5px;
      height: 100%;
      margin: 13px 0;
      background: var(--amber);
    }

    .status-mark {
      width: 14px;
      height: 14px;
      border: 3px solid var(--amber);
      background: transparent;
      transform: rotate(45deg);
    }

    .match.live .status-line,
    .match.live .status-mark { border-color: var(--teal); background: var(--teal); }
    .match.ready .status-line,
    .match.ready .status-mark { border-color: var(--ready); background: var(--ready); }
    .match.idle .status-line,
    .match.idle .status-mark { border-color: var(--idle); background: var(--idle); }
    .match.delayed .status-line,
    .match.delayed .status-mark { border-color: var(--amber); background: var(--amber); }
    .match.reconnecting .status-line,
    .match.reconnecting .status-mark { border-color: var(--coral); background: var(--coral); }
    .match.loading .status-line,
    .match.loading .status-mark { border-color: var(--amber); background: var(--amber); }
    .match.maintenance .status-line,
    .match.maintenance .status-mark { border-color: var(--coral); background: var(--coral); }

    .match-content {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 61px minmax(0, 1fr) 31px;
      padding: 0 18px 10px;
    }

    .match-head {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    .match-title { min-width: 0; }

    .match-kicker {
      color: var(--amber);
      font-family: Consolas, monospace;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .match-title strong {
      display: block;
      overflow: hidden;
      color: var(--paper);
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 25px;
      line-height: 28px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .match-state {
      min-width: 128px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
      text-align: right;
      text-transform: uppercase;
    }

    .match-state b {
      display: block;
      color: var(--amber);
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 20px;
      line-height: 21px;
    }

    .match.live .match-state b { color: var(--teal); }
    .match.ready .match-state b { color: var(--ready); }
    .match.idle .match-state b { color: var(--idle); }
    .match.delayed .match-state b { color: var(--amber); }
    .match.reconnecting .match-state b,
    .match.maintenance .match-state b { color: var(--coral); }

    .arena {
      min-height: 0;
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr) 65px minmax(0, 1fr);
      overflow: hidden;
    }

    .arena::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 1px solid #252c30;
      pointer-events: none;
    }

    .side {
      min-width: 0;
      min-height: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: 126px minmax(0, 1fr) 208px;
      align-items: center;
      gap: 14px;
      padding: 7px 0;
    }

    .side.agent {
      grid-template-columns: 208px minmax(0, 1fr) 126px;
    }

    .sprite {
      width: 126px;
      height: 126px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .sprite img {
      width: 118px;
      height: 118px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .sprite-fallback {
      display: flex;
      width: 76px;
      height: 76px;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--line);
      color: var(--muted);
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 29px;
      font-weight: 800;
    }

    .sprite-fallback[hidden],
    .roster-mon span[hidden] { display: none !important; }

    .side-copy { min-width: 0; }

    .side-label {
      overflow: hidden;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 12px;
      line-height: 16px;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pokemon-name {
      margin-top: 2px;
      overflow: hidden;
      color: var(--paper);
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 28px;
      line-height: 31px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pokemon-meta {
      height: 18px;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      line-height: 18px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hp-copy {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 12px;
      line-height: 14px;
    }

    .hp-track {
      height: 8px;
      margin-top: 4px;
      overflow: hidden;
      background: #30383d;
    }

    .hp-track i {
      display: block;
      width: 0;
      height: 100%;
      background: var(--green);
    }

    .hp-track i.mid { background: var(--amber); }
    .hp-track i.low { background: var(--coral); }

    .roster {
      width: 208px;
      height: 102px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 5px;
    }

    .roster-mon {
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #3a444a;
      background: var(--panel-raised);
    }

    .roster-mon.active { border-color: var(--amber); }
    .roster-mon.fainted { opacity: .35; }

    .roster-mon img {
      width: 58px;
      height: 43px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .roster-mon span {
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
    }

    .roster-mon i {
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 2px;
      height: 3px;
      background: #30383d;
    }

    .roster-mon i::after {
      content: "";
      display: block;
      width: var(--hp, 0%);
      height: 100%;
      background: var(--green);
    }

    .turn-strip {
      z-index: 2;
      min-width: 0;
      display: grid;
      grid-template-columns: 148px minmax(0, 1fr) 104px;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #0e1214;
    }

    .turn-strip strong {
      padding-left: 14px;
      color: var(--amber);
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 25px;
      line-height: 29px;
      text-transform: uppercase;
    }

    .turn-event {
      min-width: 0;
      overflow: hidden;
      color: var(--paper);
      font-size: 16px;
      line-height: 21px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .turn-age {
      padding-right: 14px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 13px;
      text-align: right;
    }

    .queue {
      min-height: 0;
      display: none;
      align-content: center;
      justify-items: center;
      padding: 34px 30px 26px;
      text-align: center;
    }

    .match.searching .arena,
    .match.ready .arena,
    .match.idle .arena,
    .match.loading .arena,
    .match.maintenance .arena,
    .match.reconnecting .arena { display: none; }
    .match.searching .queue,
    .match.ready .queue,
    .match.idle .queue,
    .match.loading .queue,
    .match.maintenance .queue,
    .match.reconnecting .queue { display: grid; }

    .queue-bars {
      width: 540px;
      height: 56px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      align-items: end;
      gap: 8px;
    }

    .queue-bars i {
      display: block;
      height: 16px;
      background: #31393e;
      animation: scan 1.8s steps(1, end) infinite;
    }

    .queue-bars i:nth-child(2) { animation-delay: .15s; }
    .queue-bars i:nth-child(3) { animation-delay: .3s; }
    .queue-bars i:nth-child(4) { animation-delay: .45s; }
    .queue-bars i:nth-child(5) { animation-delay: .6s; }
    .queue-bars i:nth-child(6) { animation-delay: .75s; }
    .queue-bars i:nth-child(7) { animation-delay: .9s; }
    .queue-bars i:nth-child(8) { animation-delay: 1.05s; }
    .queue-bars i:nth-child(9) { animation-delay: 1.2s; }
    .queue-bars i:nth-child(10) { animation-delay: 1.35s; }
    .queue-bars i:nth-child(11) { animation-delay: 1.5s; }
    .queue-bars i:nth-child(12) { animation-delay: 1.65s; }

    .queue strong {
      margin-top: 22px;
      color: var(--paper);
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 31px;
      line-height: 34px;
      text-transform: uppercase;
    }

    .queue span {
      margin-top: 7px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 15px;
      line-height: 21px;
      text-transform: uppercase;
    }

    .match.reconnecting .queue-bars i { animation-name: reconnect; }
    .match.ready .queue-bars i,
    .match.idle .queue-bars i,
    .match.maintenance .queue-bars i {
      height: 16px;
      animation: none;
    }

    .match-foot {
      min-width: 0;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      overflow: hidden;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 13px;
      line-height: 21px;
      text-transform: uppercase;
    }

    .match-foot span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .broadcast-foot {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 22px;
      padding: 0 18px;
      border-left: 7px solid var(--teal);
      background: var(--panel);
    }

    .broadcast-foot strong {
      display: block;
      font-family: Bahnschrift, "Arial Narrow", sans-serif;
      font-size: 20px;
      line-height: 24px;
      text-transform: uppercase;
    }

    .broadcast-foot span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 19px;
    }

    .format-mark {
      color: var(--amber) !important;
      font-family: Consolas, monospace;
      font-size: 14px !important;
      font-weight: 700;
      text-align: right;
      text-transform: uppercase;
    }

    @media (min-aspect-ratio: 4 / 3) {
      body { min-width: 1920px; min-height: 1080px; }

      .broadcast {
        width: 1920px;
        height: 1080px;
        padding: 26px 40px 24px;
        grid-template-rows: 100px minmax(0, 1fr) 64px;
        gap: 12px;
      }

      .masthead { grid-template-columns: minmax(0, 1fr) 570px; }
      .brand { padding: 11px 18px 8px 0; }
      .brand h1 { font-size: 44px; line-height: 45px; }
      .brand p { margin-top: 3px; font-size: 15px; line-height: 19px; }
      .score { padding: 8px 12px 5px; }
      .score span { font-size: 12px; line-height: 16px; }
      .score strong { font-size: 29px; line-height: 31px; }
      .metrics-state { min-height: 14px; font-size: 11px; line-height: 14px; }

      .matches {
        grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr);
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .match:first-child { grid-row: 1 / span 2; }

      .match:not(:first-child) { grid-template-columns: 50px minmax(0, 1fr); }
      .match:not(:first-child) .match-rail { padding: 10px 0 9px; }
      .match:not(:first-child) .match-number { font-size: 24px; line-height: 26px; }
      .match:not(:first-child) .status-line { width: 4px; margin: 8px 0; }
      .match:not(:first-child) .status-mark { width: 11px; height: 11px; border-width: 2px; }

      .match:not(:first-child) .match-content {
        grid-template-rows: 52px minmax(0, 1fr) 24px;
        padding: 0 12px 7px;
      }

      .match:not(:first-child) .match-head { gap: 9px; }
      .match:not(:first-child) .match-kicker { font-size: 11px; line-height: 15px; }
      .match:not(:first-child) .match-title strong { font-size: 21px; line-height: 23px; }
      .match:not(:first-child) .match-state { min-width: 104px; font-size: 11px; line-height: 15px; }
      .match:not(:first-child) .match-state b { font-size: 17px; line-height: 19px; }

      .match:not(:first-child) .arena { grid-template-rows: minmax(0, 1fr) 42px minmax(0, 1fr); }
      .match:not(:first-child) .side {
        grid-template-columns: 82px minmax(0, 1fr) 132px;
        gap: 8px;
        padding: 2px 0;
      }
      .match:not(:first-child) .side.agent { grid-template-columns: 132px minmax(0, 1fr) 82px; }
      .match:not(:first-child) .sprite { width: 82px; height: 82px; }
      .match:not(:first-child) .sprite img { width: 78px; height: 78px; }
      .match:not(:first-child) .sprite-fallback { width: 54px; height: 54px; font-size: 21px; }
      .match:not(:first-child) .side-label { font-size: 11px; line-height: 14px; }
      .match:not(:first-child) .pokemon-name { font-size: 20px; line-height: 22px; }
      .match:not(:first-child) .pokemon-meta { height: 16px; font-size: 12px; line-height: 16px; }
      .match:not(:first-child) .hp-copy { margin-top: 4px; font-size: 11px; line-height: 13px; }
      .match:not(:first-child) .hp-track { height: 5px; margin-top: 3px; }
      .match:not(:first-child) .roster { width: 132px; height: 70px; gap: 3px; }
      .match:not(:first-child) .roster-mon img { width: 39px; height: 29px; }
      .match:not(:first-child) .roster-mon span { font-size: 11px; }
      .match:not(:first-child) .roster-mon i { left: 2px; right: 2px; bottom: 1px; height: 2px; }

      .match:not(:first-child) .turn-strip { grid-template-columns: 90px minmax(0, 1fr) 90px; gap: 7px; }
      .match:not(:first-child) .turn-strip strong { padding-left: 9px; font-size: 18px; line-height: 21px; }
      .match:not(:first-child) .turn-event { font-size: 13px; line-height: 17px; }
      .match:not(:first-child) .turn-age { padding-right: 8px; font-size: 11px; }

      .match:not(:first-child) .queue { padding: 18px 16px 12px; }
      .match:not(:first-child) .queue-bars { width: 320px; height: 40px; gap: 5px; }
      .match:not(:first-child) .queue-bars i { height: 12px; }
      .match:not(:first-child) .queue strong { margin-top: 13px; font-size: 22px; line-height: 24px; }
      .match:not(:first-child) .queue span { margin-top: 4px; font-size: 12px; line-height: 16px; }
      .match:not(:first-child) .match-foot { font-size: 11px; line-height: 17px; }

      .broadcast-foot { padding: 0 16px; }
      .broadcast-foot strong { font-size: 18px; line-height: 21px; }
      .broadcast-foot span { font-size: 12px; line-height: 16px; }
      .format-mark { font-size: 12px !important; }
    }

    @keyframes scan {
      0%, 48%, 100% { height: 16px; background: #31393e; }
      49%, 66% { height: 52px; background: var(--amber); }
    }

    @keyframes reconnect {
      0%, 48%, 100% { height: 16px; background: #31393e; }
      49%, 66% { height: 52px; background: var(--coral); }
    }

    @media (prefers-reduced-motion: reduce) {
      .queue-bars i { animation: none; }
      .queue-bars i:nth-child(4),
      .queue-bars i:nth-child(8),
      .queue-bars i:nth-child(12) { height: 52px; background: var(--amber); }
      .match.reconnecting .queue-bars i:nth-child(4),
      .match.reconnecting .queue-bars i:nth-child(8),
      .match.reconnecting .queue-bars i:nth-child(12) { background: var(--coral); }
    }
  </style>
</head>
<body>
  <main class="broadcast">
    <header class="masthead">
      <div class="brand">
        <h1>Fouler Play</h1>
        <p>Three concurrent ranked battles</p>
      </div>
      <div class="scoreboard metrics-unavailable" id="scoreboard" aria-label="Current season summary">
        <div class="score"><span>Season</span><strong id="record">--</strong></div>
        <div class="score"><span>ELO</span><strong id="elo">--</strong></div>
        <div class="score live">
          <span>Matches live</span><strong id="liveCount">-- / 3</strong>
          <small class="metrics-state" id="metricsState" role="status" aria-live="polite">Scores connecting</small>
        </div>
      </div>
    </header>

    <section class="matches" id="matches" aria-live="polite"></section>

    <footer class="broadcast-foot">
      <div>
        <strong>Three ranked matches. One battle bot.</strong>
        <span>Battle positions refresh automatically. Move selection stays private.</span>
      </div>
      <span class="format-mark">Pokemon Showdown<br>Gen 9 OU</span>
    </footer>
  </main>

  <script>
    (function () {
      "use strict";

      var SLOT_COUNT = 3;
      var POLL_MS = 2000;
      var slots = {};
      var slotTruth = {};
      var scoreboardSnapshot = { record: null, elo: null, liveCount: null };

      function escapeText(value, fallback) {
        var text = String(value == null ? "" : value).trim();
        return text || fallback || "--";
      }

      function titleWords(value) {
        return escapeText(value, "")
          .replace(/[-_]+/g, " ")
          .replace(/\s+/g, " ")
          .toLowerCase()
          .replace(/\b[a-z]/g, function (letter) { return letter.toUpperCase(); });
      }

      function initials(pokemon) {
        return escapeText((pokemon || {}).display_name || (pokemon || {}).name, "?")
          .replace(/[^A-Za-z0-9]/g, "")
          .slice(0, 2)
          .toUpperCase() || "?";
      }

      function hpPercent(pokemon) {
        if (!pokemon) { return null; }
        if (pokemon.fainted) { return 0; }
        var value = Number(pokemon.hp_percent);
        return isFinite(value) ? Math.max(0, Math.min(100, value)) : null;
      }

      function hpLabel(pokemon) {
        var value = hpPercent(pokemon);
        if (pokemon && pokemon.fainted) { return "Fainted"; }
        return value == null ? "HP unavailable" : Math.round(value) + "%";
      }

      function hpClass(value) {
        if (value != null && value < 25) { return "low"; }
        if (value != null && value < 50) { return "mid"; }
        return "";
      }

      function imageSources(pokemon) {
        var sources = ((pokemon || {}).sprite_urls || [(pokemon || {}).sprite_url]).filter(Boolean);
        var staticSources = sources.filter(function (url) { return /\.png(?:\?|$)/i.test(url); });
        return staticSources.length ? staticSources : sources;
      }

      function usableBattleView(view) {
        return !!(
          view &&
          view.user && view.user.active &&
          view.opponent && view.opponent.active
        );
      }

      function staleBattleTruth(lab) {
        lab = lab || {};
        return lab.stale === true || lab.freshness === "stale" || !!(lab.battle_view && lab.battle_view.stale);
      }

      function explicitSearchActivity(lab) {
        lab = lab || {};
        return lab.search_active === true ||
          lab.searching === true ||
          lab.queue_active === true ||
          lab.matchmaking_active === true ||
          Number(lab.search_count) > 0;
      }

      function timerLabel(label, value, fallback, appendAgo) {
        var raw = String(value == null ? "" : value).trim().replace(/\s+ago$/i, "");
        var timer = raw || fallback;
        return label + ": " + timer + (raw && appendAgo ? " ago" : "");
      }

      function inactivePresentation(lab) {
        var rawStatus = escapeText((lab || {}).status, "Idle");
        var key = rawStatus.toLowerCase();

        if (/ready|complete|staged/.test(key)) {
          var firstMatch = /staged/.test(key);
          return {
            className: "ready",
            live: false,
            viewReady: false,
            opponent: firstMatch ? "Ready for the first match" : "Next match ready",
            state: "Ready",
            stateDetail: "No active battle",
            queueTitle: firstMatch ? "Ready for the first match" : "Ready for next match",
            queueDetail: "No opponent search is active",
            footLeft: "Gen 9 OU ranked ladder",
            footRight: "Status: current",
          };
        }

        if (/blocked|credential|error|unavailable|offline/.test(key)) {
          return {
            className: "maintenance",
            live: false,
            viewReady: false,
            opponent: "Match feed unavailable",
            state: "Unavailable",
            stateDetail: "No active battle",
            queueTitle: "Match feed unavailable",
            queueDetail: "No match can be shown right now",
            footLeft: "Gen 9 OU ranked ladder",
            footRight: "Status: unavailable",
          };
        }

        if (explicitSearchActivity(lab)) {
          return {
            className: "searching",
            live: false,
            viewReady: false,
            opponent: "Looking for an opponent",
            state: "Searching",
            stateDetail: "Ranked matchmaking",
            queueTitle: "Finding a ranked opponent",
            queueDetail: "The match will appear as soon as it begins",
            footLeft: "Gen 9 OU ranked ladder",
            footRight: "Refresh: every 2 seconds",
          };
        }

        var paused = /maint|held|paused|stopped/.test(key);

        return {
          className: "idle",
          live: false,
          viewReady: false,
          opponent: paused ? "Battles paused" : "No match in progress",
          state: "Idle",
          stateDetail: "No active battle",
          queueTitle: paused ? "Battles are paused" : "No match in progress",
          queueDetail: "The ladder is not searching right now",
          footLeft: "Gen 9 OU ranked ladder",
          footRight: "Status: current",
        };
      }

      function slotPresentation(lab) {
        lab = lab || {};
        var view = lab.battle_view || null;
        if (staleBattleTruth(lab)) {
          var staleViewReady = usableBattleView(view);
          var staleAge = escapeText(lab.freshness_age_label, "Update delayed");
          return {
            className: staleViewReady ? "delayed" : "delayed loading",
            live: false,
            viewReady: staleViewReady,
            delayed: true,
            opponent: lab.opponent ? "vs " + escapeText(lab.opponent, "Opponent") : "Last known match",
            state: "Stale",
            stateDetail: "Latest confirmed view",
            queueTitle: "Match update delayed",
            queueDetail: "Waiting for a current match update",
            footLeft: "Gen 9 OU ranked ladder",
            footRight: timerLabel("Last update", staleAge, "delayed", true),
          };
        }
        if (!lab.active) { return inactivePresentation(lab); }

        if (!usableBattleView(view)) {
          return {
            className: "loading",
            live: true,
            viewReady: false,
            opponent: "vs " + escapeText(lab.opponent, "Opponent pending"),
            state: "Loading",
            stateDetail: "Match in progress",
            queueTitle: "Match feed is loading",
            queueDetail: "The battle is active; details will appear shortly",
            footLeft: "Gen 9 OU ranked ladder",
            footRight: timerLabel("Battle time", lab.age_label, "starting", false),
          };
        }

        return {
          className: "live",
          live: true,
          viewReady: true,
          opponent: "vs " + escapeText(lab.opponent, "Opponent"),
          state: "Live",
          stateDetail: "Ranked match in progress",
          queueTitle: "Match in progress",
          queueDetail: "Battle details are current",
          footLeft: "Gen 9 OU ranked ladder",
          footRight: timerLabel("Battle time", lab.age_label, "starting", false),
        };
      }

      function create(tag, className, text) {
        var node = document.createElement(tag);
        if (className) { node.className = className; }
        if (text != null) { node.textContent = String(text); }
        return node;
      }

      function makeQueueBars() {
        var bars = create("div", "queue-bars");
        for (var index = 0; index < 12; index += 1) { bars.appendChild(create("i")); }
        return bars;
      }

      function makeSide(className, label) {
        var side = create("section", "side " + className);
        var sprite = create("div", "sprite");
        sprite.dataset.role = "sprite";
        var copy = create("div", "side-copy");
        copy.appendChild(create("div", "side-label", label));
        var account = create("div", "side-label", "--");
        account.dataset.role = "account";
        copy.appendChild(account);
        var name = create("div", "pokemon-name", "Pokemon pending");
        name.dataset.role = "name";
        copy.appendChild(name);
        var meta = create("div", "pokemon-meta", "Battle details loading");
        meta.dataset.role = "meta";
        copy.appendChild(meta);
        var hpCopy = create("div", "hp-copy");
        hpCopy.appendChild(create("span", "", "HP"));
        var hpValue = create("span", "", "--");
        hpValue.dataset.role = "hp-copy";
        hpCopy.appendChild(hpValue);
        copy.appendChild(hpCopy);
        var hpTrack = create("div", "hp-track");
        var hpFill = create("i");
        hpFill.dataset.role = "hp-fill";
        hpTrack.appendChild(hpFill);
        copy.appendChild(hpTrack);
        var roster = create("div", "roster");
        roster.dataset.role = "roster";

        if (className === "agent") {
          side.appendChild(roster);
          side.appendChild(copy);
          side.appendChild(sprite);
        } else {
          side.appendChild(sprite);
          side.appendChild(copy);
          side.appendChild(roster);
        }
        return side;
      }

      function buildSlot(slot) {
        var match = create("article", "match loading");
        match.id = "match-" + slot;
        match.dataset.slot = String(slot);

        var rail = create("div", "match-rail");
        rail.appendChild(create("span", "match-number", "0" + slot));
        rail.appendChild(create("span", "status-line"));
        rail.appendChild(create("span", "status-mark"));
        match.appendChild(rail);

        var content = create("div", "match-content");
        var head = create("header", "match-head");
        var title = create("div", "match-title");
        title.appendChild(create("span", "match-kicker", "Ranked match " + slot));
        var opponent = create("strong", "", "Checking match status");
        opponent.dataset.role = "opponent";
        title.appendChild(opponent);
        var state = create("div", "match-state");
        var stateStrong = create("b", "", "Connecting");
        stateStrong.dataset.role = "state";
        state.appendChild(stateStrong);
        var stateDetail = create("span", "", "Waiting for first update");
        stateDetail.dataset.role = "state-detail";
        state.appendChild(stateDetail);
        head.appendChild(title);
        head.appendChild(state);
        content.appendChild(head);

        var arena = create("div", "arena");
        var opponentSide = makeSide("opponent", "Opponent");
        opponentSide.dataset.role = "opponent-side";
        arena.appendChild(opponentSide);
        var turn = create("div", "turn-strip");
        var turnNumber = create("strong", "", "Turn --");
        turnNumber.dataset.role = "turn";
        var turnEvent = create("span", "turn-event", "Waiting for match details");
        turnEvent.dataset.role = "event";
        var turnAge = create("span", "turn-age", "--");
        turnAge.dataset.role = "age";
        turn.appendChild(turnNumber);
        turn.appendChild(turnEvent);
        turn.appendChild(turnAge);
        arena.appendChild(turn);
        var agentSide = makeSide("agent", "Fouler");
        agentSide.dataset.role = "agent-side";
        arena.appendChild(agentSide);
        content.appendChild(arena);

        var queue = create("div", "queue");
        queue.appendChild(makeQueueBars());
        var queueTitle = create("strong", "", "Connecting to match feed");
        queueTitle.dataset.role = "queue-title";
        var queueDetail = create("span", "", "Waiting for the first update");
        queueDetail.dataset.role = "queue-detail";
        queue.appendChild(queueTitle);
        queue.appendChild(queueDetail);
        content.appendChild(queue);

        var foot = create("footer", "match-foot");
        var footLeft = create("span", "", "Gen 9 OU ranked ladder");
        footLeft.dataset.role = "foot-left";
        var footRight = create("span", "", "Status: connecting");
        footRight.dataset.role = "foot-right";
        foot.appendChild(footLeft);
        foot.appendChild(footRight);
        content.appendChild(foot);

        match.appendChild(content);
        slots[slot] = match;
        return match;
      }

      function first(root, role) {
        return root.querySelector('[data-role="' + role + '"]');
      }

      function setSprite(root, pokemon) {
        var sources = imageSources(pokemon);
        var spriteKey = escapeText((pokemon || {}).display_name || (pokemon || {}).name, "?") + "|" + sources.join("|");
        if (root.dataset.spriteKey === spriteKey) { return; }
        root.dataset.spriteKey = spriteKey;
        root.replaceChildren();
        var fallback = create("span", "sprite-fallback", initials(pokemon));
        root.appendChild(fallback);
        if (!sources.length) { return; }
        var image = document.createElement("img");
        var sourceIndex = 0;
        image.alt = "";
        image.referrerPolicy = "no-referrer";
        image.addEventListener("load", function () { fallback.hidden = true; });
        image.addEventListener("error", function () {
          sourceIndex += 1;
          if (sourceIndex < sources.length) { image.src = sources[sourceIndex]; }
          else { image.remove(); }
        });
        image.src = sources[0];
        root.appendChild(image);
      }

      function makeRosterMon(pokemon, active) {
        var cell = create("div", "roster-mon" + (active ? " active" : "") + (pokemon && pokemon.fainted ? " fainted" : ""));
        if (!pokemon) {
          cell.appendChild(create("span", "", "--"));
          return cell;
        }
        var fallback = create("span", "", initials(pokemon));
        cell.appendChild(fallback);
        var sources = imageSources(pokemon);
        if (sources.length) {
          var image = document.createElement("img");
          var sourceIndex = 0;
          image.alt = "";
          image.referrerPolicy = "no-referrer";
          image.addEventListener("load", function () { fallback.hidden = true; });
          image.addEventListener("error", function () {
            sourceIndex += 1;
            if (sourceIndex < sources.length) { image.src = sources[sourceIndex]; }
            else { image.remove(); }
          });
          image.src = sources[0];
          cell.appendChild(image);
        }
        var hp = create("i");
        hp.style.setProperty("--hp", (hpPercent(pokemon) == null ? 0 : hpPercent(pokemon)) + "%");
        cell.appendChild(hp);
        return cell;
      }

      function renderRoster(root, side) {
        var team = [];
        if (side && side.active) { team.push(side.active); }
        team = team.concat((side && side.reserve) || []);
        var rosterKey = team.map(function (pokemon) {
          return [
            (pokemon || {}).display_name || (pokemon || {}).name || "empty",
            hpPercent(pokemon),
            !!(pokemon && pokemon.fainted),
          ].join(":");
        }).join("|");
        if (root.dataset.rosterKey === rosterKey) { return; }
        root.dataset.rosterKey = rosterKey;
        var fragment = document.createDocumentFragment();
        for (var index = 0; index < 6; index += 1) {
          fragment.appendChild(makeRosterMon(team[index], index === 0));
        }
        root.replaceChildren(fragment);
      }

      function renderSide(root, side, fallbackAccount) {
        side = side || {};
        var pokemon = side.active || {};
        var hp = hpPercent(pokemon);
        first(root, "account").textContent = escapeText(side.account, fallbackAccount);
        first(root, "name").textContent = escapeText(pokemon.display_name || titleWords(pokemon.name), "Pokemon pending");
        var types = (pokemon.types || []).map(titleWords).join(" / ");
        first(root, "meta").textContent = types || "Battle details unavailable";
        first(root, "hp-copy").textContent = hpLabel(pokemon);
        var fill = first(root, "hp-fill");
        fill.style.width = (hp == null ? 0 : hp) + "%";
        fill.className = hpClass(hp);
        setSprite(first(root, "sprite"), pokemon);
        renderRoster(first(root, "roster"), side);
      }

      function latestEvent(lab) {
        var events = (lab && lab.events) || [];
        if (!events.length) { return "Reading the live position"; }
        return escapeText(events[events.length - 1], "Reading the live position");
      }

      function renderSlot(slot, payload) {
        var root = slots[slot];
        var lab = (payload && payload.battle_lab) || {};
        var view = lab.battle_view || null;
        var presentation = slotPresentation(lab);
        slotTruth[slot] = { active: presentation.live, viewReady: presentation.viewReady };
        root.className = "match " + presentation.className;
        first(root, "opponent").textContent = presentation.opponent;
        first(root, "state").textContent = presentation.state;
        first(root, "state-detail").textContent = presentation.stateDetail;
        first(root, "queue-title").textContent = presentation.queueTitle;
        first(root, "queue-detail").textContent = presentation.queueDetail;
        first(root, "foot-left").textContent = presentation.footLeft;
        first(root, "foot-right").textContent = presentation.footRight;

        if (presentation.viewReady) {
          renderSide(first(root, "opponent-side"), view.opponent, "Opponent");
          renderSide(first(root, "agent-side"), view.user, "Fouler");
          first(root, "turn").textContent = "Turn " + escapeText(view.turn == null ? lab.turn : view.turn, "--");
          first(root, "event").textContent = latestEvent(lab);
          first(root, "age").textContent = timerLabel("Battle time", lab.age_label, "starting", false);
        }
      }

      function renderReconnect(slot) {
        var root = slots[slot];
        var previous = slotTruth[slot] || null;
        if (previous) {
          root.className = "match delayed" + (previous.viewReady ? "" : " loading");
          first(root, "state").textContent = "Stale";
          first(root, "state-detail").textContent = previous.active ? "Latest confirmed view" : "Latest confirmed status";
          first(root, "queue-title").textContent = "Match update delayed";
          first(root, "queue-detail").textContent = "Showing the latest confirmed information while reconnecting";
          first(root, "foot-right").textContent = "Last update: delayed";
          return;
        }
        root.className = "match reconnecting";
        first(root, "state").textContent = "Unavailable";
        first(root, "state-detail").textContent = "Match feed reconnecting";
        first(root, "queue-title").textContent = "Match feed unavailable";
        first(root, "queue-detail").textContent = "Waiting for the first successful update";
        first(root, "foot-right").textContent = "Status: reconnecting";
      }

      function updateScoreboard(payloads) {
        var labs = payloads.map(function (payload) { return payload && payload.battle_lab; }).filter(Boolean);
        var recordSource = labs.find(function (lab) {
          if (lab.wins == null || lab.losses == null || lab.wins === "" || lab.losses === "") { return false; }
          var wins = Number(lab.wins);
          var losses = Number(lab.losses);
          return isFinite(wins) && wins >= 0 && isFinite(losses) && losses >= 0;
        });
        var eloSource = labs.find(function (lab) {
          var elo = Number(lab.elo);
          return isFinite(elo) && elo > 0;
        });

        if (recordSource) {
          scoreboardSnapshot.record = Math.round(Number(recordSource.wins)) + "-" + Math.round(Number(recordSource.losses));
        }
        if (eloSource) { scoreboardSnapshot.elo = Math.round(Number(eloSource.elo)); }
        if (labs.length === SLOT_COUNT) {
          scoreboardSnapshot.liveCount = labs.filter(function (lab) {
            return !!lab.active && !staleBattleTruth(lab);
          }).length;
        }

        document.getElementById("record").textContent = scoreboardSnapshot.record == null ? "--" : scoreboardSnapshot.record;
        document.getElementById("elo").textContent = scoreboardSnapshot.elo == null ? "--" : scoreboardSnapshot.elo;
        document.getElementById("liveCount").textContent = scoreboardSnapshot.liveCount == null
          ? "-- / 3"
          : scoreboardSnapshot.liveCount + " / 3";

        var completePoll = labs.length === SLOT_COUNT;
        var staleCount = labs.filter(staleBattleTruth).length;
        var hasSnapshot = scoreboardSnapshot.record != null || scoreboardSnapshot.elo != null || scoreboardSnapshot.liveCount != null;
        var metricsClass = "metrics-current";
        var metricsLabel = "Scores current";
        if (!labs.length) {
          metricsClass = hasSnapshot ? "metrics-stale" : "metrics-unavailable";
          metricsLabel = hasSnapshot ? "Score update delayed" : "Scores unavailable";
        } else if (!completePoll) {
          metricsClass = "metrics-stale";
          metricsLabel = "Score update delayed";
        } else if (staleCount) {
          metricsClass = "metrics-stale";
          metricsLabel = staleCount + (staleCount === 1 ? " match stale" : " matches stale");
        } else if (!recordSource || !eloSource) {
          metricsClass = hasSnapshot ? "metrics-stale" : "metrics-unavailable";
          metricsLabel = hasSnapshot ? "Score details delayed" : "Scores unavailable";
        }
        document.getElementById("scoreboard").className = "scoreboard " + metricsClass;
        document.getElementById("metricsState").textContent = metricsLabel;
      }

      function poll() {
        var requests = [];
        for (var slot = 1; slot <= SLOT_COUNT; slot += 1) {
          (function (slotNumber) {
            requests.push(
              fetch("/slot/" + slotNumber + "/state?t=" + Date.now(), { cache: "no-store" })
                .then(function (response) {
                  if (!response.ok) { throw new Error("state unavailable"); }
                  return response.json();
                })
                .then(function (payload) { renderSlot(slotNumber, payload); return payload; })
                .catch(function () { renderReconnect(slotNumber); return null; })
            );
          })(slot);
        }
        Promise.all(requests).then(function (payloads) {
          updateScoreboard(payloads);
          document.body.dataset.ready = "true";
        });
      }

      var matches = document.getElementById("matches");
      for (var slot = 1; slot <= SLOT_COUNT; slot += 1) { matches.appendChild(buildSlot(slot)); }
      poll();
      setInterval(poll, POLL_MS);
    })();
  </script>
</body>
</html>
