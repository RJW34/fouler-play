<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fouler Stats</title>
<style>
:root {
  --bg: #0a0a14;
  --accent-blue: #08d9d6;
  --accent-green: #4ade80;
  --accent-red: #f87171;
  --accent-gold: #ffd700;
  --text: #eaeaea;
  --text-dim: #777;
  --border: rgba(8,217,214,0.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:640px;height:220px;overflow:hidden;
  background:linear-gradient(135deg, #080812 0%, #0a0a1a 60%, #060814 100%);
  font-family:system-ui,-apple-system,sans-serif;
  color:var(--text);
}

/* Header */
.header{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px 6px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.3);
}
.game-name{
  font-size:15px;font-weight:700;letter-spacing:2px;
  color:var(--accent-blue);text-transform:uppercase;
}
.game-icon{font-size:16px;line-height:1}
.account-label{
  font-size:11px;color:var(--text-dim);letter-spacing:1px;
  margin-left:auto;
}
.live-pill{
  padding:2px 8px;border-radius:20px;
  background:rgba(74,222,128,0.15);
  border:1px solid rgba(74,222,128,0.3);
  font-size:9px;font-weight:800;letter-spacing:2px;
  color:var(--accent-green);text-transform:uppercase;
  display:none;
}
.live-pill.show{display:block}

/* ELO + stats row */
.main-row{
  display:grid;
  grid-template-columns: 180px 1fr;
  height:138px;
}

/* ELO block */
.elo-block{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:10px 14px;
  border-right:1px solid var(--border);
  gap:2px;
}
.elo-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim)}
.elo-val{
  font-size:52px;font-weight:900;line-height:1;
  background:linear-gradient(135deg, var(--accent-blue) 30%, var(--accent-gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.elo-src{font-size:9px;color:var(--text-dim)}

/* Stats block */
.stats-block{
  display:flex;flex-direction:column;
  padding:10px 16px;
  gap:8px;
}

.stats-row{
  display:flex;gap:12px;align-items:center;
}
.stat{display:flex;flex-direction:column;align-items:center;min-width:52px}
.stat .lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim)}
.stat .val{font-size:24px;font-weight:800;line-height:1}
.val.wins{color:var(--accent-green)}
.val.losses{color:var(--accent-red)}
.val.wr{color:var(--accent-gold)}

.sep-line{width:1px;background:rgba(255,255,255,0.08);align-self:stretch;margin:0 2px}

.today-row{
  display:flex;align-items:center;gap:8px;
  padding-top:4px;border-top:1px solid rgba(255,255,255,0.06);
}
.today-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
.today-stats{display:flex;gap:10px;font-size:13px;font-weight:700}
.today-stats .tw{color:var(--accent-green)}
.today-stats .tl{color:var(--accent-red)}

/* Battle slots row */
.battles-row{
  display:flex;align-items:center;gap:8px;
  padding-top:4px;
}
.battles-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
.slots{display:flex;gap:6px}
.slot-dot{
  width:12px;height:12px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);
  background:transparent;
}
.slot-dot.active{
  background:var(--accent-green);
  border-color:var(--accent-green);
  box-shadow:0 0 8px rgba(74,222,128,0.5);
}

/* Footer */
.footer{
  display:flex;align-items:center;gap:10px;
  padding:5px 14px;
  background:rgba(0,0,0,0.35);
  border-top:1px solid var(--border);
  font-size:10px;color:var(--text-dim);
}
.conn-dot{
  width:6px;height:6px;border-radius:50%;
  background:#555;flex-shrink:0;
}
.conn-dot.ok{background:var(--accent-green);box-shadow:0 0 5px var(--accent-green)}
.upd{margin-left:auto;font-size:9px;opacity:0.5}
</style>
</head>
<body>

<div class="header">
  <span class="game-icon">⚔️</span>
  <span class="game-name">Fouler Play</span>
  <span class="live-pill" id="livePill">LIVE</span>
  <span class="account-label" id="accountLabel">—</span>
</div>

<div class="main-row">
  <div class="elo-block">
    <div class="elo-lbl">ELO</div>
    <div class="elo-val" id="eloVal">----</div>
    <div class="elo-src" id="eloSrc">loading</div>
  </div>
  <div class="stats-block">
    <div class="stats-row">
      <div class="stat">
        <div class="lbl">Wins</div>
        <div class="val wins" id="totalWins">0</div>
      </div>
      <div class="sep-line"></div>
      <div class="stat">
        <div class="lbl">Losses</div>
        <div class="val losses" id="totalLosses">0</div>
      </div>
      <div class="sep-line"></div>
      <div class="stat">
        <div class="lbl">Win%</div>
        <div class="val wr" id="winRate">0%</div>
      </div>
    </div>

    <div class="today-row">
      <span class="today-lbl">Today:</span>
      <div class="today-stats">
        <span class="tw" id="todayW">0W</span>
        <span class="tl" id="todayL">0L</span>
      </div>
    </div>

    <div class="battles-row">
      <span class="battles-lbl">Battles:</span>
      <div class="slots">
        <div class="slot-dot" id="dot1"></div>
        <div class="slot-dot" id="dot2"></div>
        <div class="slot-dot" id="dot3"></div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="conn-dot" id="connDot"></div>
  <span id="connText">Connecting...</span>
  <span class="upd" id="lastUpdate">--:--</span>
</div>

<script>
const STATE_URL = '/magneton-state';
const REFRESH_MS = 5000;

async function fetchState() {
  try {
    const resp = await fetch(STATE_URL + '?t=' + Date.now(), {cache:'no-store'});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    render(data);
    document.getElementById('connDot').className = 'conn-dot ok';
    document.getElementById('connText').textContent = 'MAGNETON';
  } catch(e) {
    document.getElementById('connDot').className = 'conn-dot';
    document.getElementById('connText').textContent = 'Offline';
  }
}

function render(data) {
  const s = data.status || {};
  const battles = data.battles || [];
  const accounts = Object.keys(data.accounts_elo || s.accounts_elo || {});
  const primary = accounts[0] || '';

  document.getElementById('accountLabel').textContent = primary ? primary.toUpperCase() : '—';

  const elo = s.elo;
  document.getElementById('eloVal').textContent = elo != null ? elo : '----';
  document.getElementById('eloSrc').textContent = s.elo_source === 'showdown' ? 'Showdown Ladder' : 'local';

  const wins = s.wins || 0;
  const losses = s.losses || 0;
  const total = wins + losses;
  const wr = total > 0 ? ((wins / total) * 100).toFixed(1) + '%' : '—';
  document.getElementById('totalWins').textContent = wins;
  document.getElementById('totalLosses').textContent = losses;
  document.getElementById('winRate').textContent = wr;

  document.getElementById('todayW').textContent = (s.today_wins || 0) + 'W';
  document.getElementById('todayL').textContent = (s.today_losses || 0) + 'L';

  const slotMap = {};
  battles.forEach((b, i) => { slotMap[b.slot || (i + 1)] = b; });
  [1,2,3].forEach(n => {
    const dot = document.getElementById('dot' + n);
    if (dot) dot.classList.toggle('active', !!slotMap[n]);
  });

  const liveEl = document.getElementById('livePill');
  if (battles.length > 0) liveEl.classList.add('show');
  else liveEl.classList.remove('show');

  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

fetchState();
setInterval(fetchState, REFRESH_MS);
</script>
</body>
</html>
